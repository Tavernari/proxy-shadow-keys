[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-shadow-keys"
version = "0.1.0"
description = "CLI tool to manage proxy shadow keys"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-bdd>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "tomli>=2.0.1; python_version < '3.11'"
]

[project.scripts]
proxy-shadow-keys = "proxy_shadow_keys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
